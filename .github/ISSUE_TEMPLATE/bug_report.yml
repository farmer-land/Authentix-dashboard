name: Bug report
description: Something is broken in production or staging
labels: [bug, team-frontend]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Certificate generation UI
        - Dashboard pages / org views
        - Auth flows (login, signup, session)
        - Proxy / API layer
        - Templates UI
        - Billing UI
        - Export / download flows
        - Other
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Clear description of the bug. Include console errors and network tab details if available.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to /dashboard/org/<slug>/...
        2. Click ...
        3. See error ...
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Production
        - Staging
        - Local
    validations:
      required: true

  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome
        - Safari
        - Firefox
        - Edge
        - Other / multiple
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Console errors / Vercel logs
      render: text

  - type: input
    id: jira
    attributes:
      label: Jira ticket key (if known)
      description: e.g. GARDEN-123 — leave blank if this issue was filed first and Jira not yet created.
