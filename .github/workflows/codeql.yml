name: CodeQL

# DISABLED 2026-08-22 — CodeQL code scanning requires GitHub Advanced Security,
# which is not available on this account for a PRIVATE repository. Both repos went
# private on 2026-08-22; this is the cost of that decision.
#
# Every run since fails with:
#   Advanced Security must be enabled for this repository to use code scanning.
#
# A permanently-red check trains everyone to ignore red. So the automatic triggers
# are removed rather than left failing.
#
# Coverage is NOT lost: Dependabot is unaffected, and Semgrep is available (see the
# backend repo's .github/workflows/semgrep.yml — mirror it here if wanted).
#
# To restore: make the repo public again, or enable GitHub Advanced Security, then
# restore the push/pull_request/schedule triggers.
on:
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL Analysis (JS/TS)
    runs-on: ubuntu-latest

    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # ✅ Install dependencies (improves analysis quality)
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # ✅ Initialize CodeQL with better queries
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.3
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended,security-and-quality

      # ✅ Run analysis
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.37.3
