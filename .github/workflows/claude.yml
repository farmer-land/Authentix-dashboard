name: Claude Code
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]

jobs:
  claude:
    if: |
      contains(github.event.comment.body, '@claude') ||
      contains(github.event.issue.body, '@claude') ||
      contains(github.event.issue.title, '@claude')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

# Runs on GitHub's infrastructure, not Mayank's laptop — @claude works in issues/PRs
# even when Cowork and the desktop app are both closed.
#
# Setup still needed (one-time, needs repo admin access):
#   1. Install the Claude GitHub App: https://github.com/apps/claude
#   2. Add an ANTHROPIC_API_KEY secret (or CLAUDE_CODE_OAUTH_TOKEN from `claude setup-token`)
#      under Settings -> Secrets and variables -> Actions
#   3. Merge this workflow file
# Fastest path: run `/install-github-app` from Claude Code in this repo and it does all three.
# If you share one secret across both Authentix repos, add it as an organization-level
# Actions secret once instead of per-repo.
